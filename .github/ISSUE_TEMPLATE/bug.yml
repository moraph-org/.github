name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug]: "
type: Bug
labels: [needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Please search existing issues first. For security vulnerabilities, do **not** open a public issue; use the repository's Security tab ("Report a vulnerability") instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem, including the page URL if relevant.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Web (desktop browser)
        - Web (mobile browser)
        - Cloudflare Worker / server
        - iOS
        - iPadOS
        - macOS
        - watchOS
        - tvOS
        - Android
        - MCP server
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / browser
      description: App version, commit SHA, or browser and OS version.
      placeholder: e.g. Safari 19 on macOS 26, or commit abc1234
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or console output
      description: Paste any relevant output. It will be formatted as code automatically.
      render: shell
