name: Initiative
description: A portfolio-level outcome spanning a quarter or more, delivered through Epics
title: "[Initiative]: "
type: Initiative
body:
  - type: markdown
    attributes:
      value: |
        An Initiative is a portfolio-level outcome. Add the Epics that deliver it as **sub-issues**.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: The result we want, stated in terms of users, partners or the business.
    validations:
      required: true
  - type: textarea
    id: why-now
    attributes:
      label: Why now?
      description: Evidence, opportunity or risk that makes this a priority this quarter.
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: Success metrics
      value: |
        - Metric: baseline -> target
    validations:
      required: true
  - type: dropdown
    id: quarter
    attributes:
      label: Target quarter
      options:
        - 2026 Q4
        - 2027 Q1
        - 2027 Q2
        - 2027 Q3
        - 2027 Q4
        - Later
    validations:
      required: true
  - type: textarea
    id: epics
    attributes:
      label: Candidate epics
      description: Known Epics, to be linked as sub-issues.
